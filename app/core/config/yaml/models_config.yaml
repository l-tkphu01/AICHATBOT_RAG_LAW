# ============================================================
# MODEL CONFIGS - Model refs theo chức năng
# ============================================================

runtime:
  # Soft refusal: Dùng model nhỏ để sinh ra lời từ chối mềm mỏng, duyên dáng
  soft_refusal:
    provider: "groq"
    model_id: "llama-3.1-8b-instant"
    temperature: 0.6
    max_tokens: 220
    timeout_s: 5
    # fallback_provider: "openrouter"
    # fallback_model: "google/gemini-2.5-flash-lite"

  # Rút gọn câu hỏi dài, chống "loãng" RAG
  input_summarizer:
    provider: "groq"
    model_id: "llama-3.1-8b-instant"
    temperature: 0.1
    max_tokens: 256
    timeout_s: 5
    response_format: "json_object"
    # fallback_provider: "openrouter"
    # fallback_model: "google/gemini-2.5-flash-lite"

  # Query rewriter / Multi-query generator: Dùng model nhỏ (8B) cho tác vụ rewrite ngữ pháp
  query_rewriter:
    provider: "groq"
    model_id: "llama-3.1-8b-instant"
    temperature: 0.1
    max_tokens: 1024
    timeout_s: 8
    response_format: "json_object"
    # fallback_provider: "openrouter"
    # fallback_model: "google/gemini-2.5-flash-lite"

  # Embedding model for chunk/query vectorization
  embedding:
    provider: "cohere"
    model_id: "embed-multilingual-v3.0"
    timeout_s: 30
    batch_size: 96

  # RAG Generator model (Sinh cấu trả lời cuối - ngữ cảnh dài, giá cực rẻ qua OpenRouter) 
  generator:
    provider: "openrouter"
    model_id: "..."
    temperature: 0.1
    max_tokens: 1536
    timeout_s: 30
    fallback_provider: "groq"
    fallback_model: "llama-3.3-70b-versatile"

  # Intent fallback classifier cho tiếng Việt
  intent_fallback:
    provider: "groq"
    model_id: "llama-3.3-70b-versatile"
    temperature: 0.1
    max_tokens: 512
    reasoning_format: "hidden"
    timeout_s: 15
    # fallback_provider: "openrouter"
    # fallback_model: "google/gemini-2.5-flash-lite"
