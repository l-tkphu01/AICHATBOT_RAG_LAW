# ============================================================
# GUARDIAN PIPELINE CONFIG - HYBRID (RULE + SELECTIVE MODEL)
# UPDATED VERSION v2.1 (Optimized & Cleaned Structural Debt)
# ============================================================

metadata:
  name: "guardian_config"
  version: "2.1.0"
  purpose: "Hybrid safety + intent guard (feature + model routing)"
  domain: "legal_rag_vn"
  scope: "legal_only"

# ============================================================
# [PHẦN 1] ACTIVE RUNTIME PIPELINE (ĐANG HOẠT ĐỘNG THỰC TẾ)
# ============================================================

# ----------------------------------------------------------
# LỚP 0 & 1: VALIDATION & NORMALIZATION
# ----------------------------------------------------------
input_validation:
  max_input_chars: 2000
  summarize_threshold: 1000
  max_input_lines: 30
  hard_limit_action: "reject"
  warning_threshold: 1800
  summarize_action: "summarize_then_classify"
  reject_message_key: "input_too_long"

# ----------------------------------------------------------
# LỚP 1: Normalization
# ----------------------------------------------------------
normalization:
  enabled: true
  lowercase: true
  trim_whitespace: true
  collapse_repeated_spaces: true
  normalize_punctuation: true
  normalize_unicode_nfkc: true
  preserve_diacritics: true

  teencode_map:
    ko: "không"
    k: "không"
    hk: "không"
    dc: "được"
    đc: "được"
    trc: "trước"
    ns: "nói"
    ntn: "như thế nào"
    lm: "làm"
    mk: "mình"
    vs: "với"
    r: "rồi"
    j: "gì"

# ----------------------------------------------------------
# LỚP 2: FEATURE EXTRACTION (REGEX BASED)
# ----------------------------------------------------------
feature_extraction:
  regex_patterns:

    banned:
      - 'b[ạa]o\s*l[ựu]c'
      - 'gi[ếe]t'
      - 'ma\s*t[úu]y'
      - 'c[ờo]\s*b[ạa]c'
      - '\bh[a@4¥][\s\-_]*c[\s\-_]*k\b'
      - 'l[ừu]\s*đ[ảa]o'
      - 'h\.a\.c\.k'

    injection:
      - 'ignore.*(instruction|rule|prompt)'
      - 'system\s*prompt'
      - 'developer\s*message'
      - 'reveal.*(prompt|secret|key|policy)'
      - 'api[\s_-]*key|secret[\s_-]*key|token'
      - 'jailbreak|bypass|override|exfiltrat(e|ion)'
      - '\bsudo\b|\broot\b'
      - 'do\s+anything\s+now'
      - 'b[ỏo]\s*qua\s*(m[ọo]i\s*)?(quy\s*t[ắa]c|h[ướu][ớo]ng\s*d[ẫa]n|ch[íi]nh\s*s[áa]ch)'
      - '([đd][âa]y\s*l[àa]\s*)?quy\s*t[ắa]c\s*m[ớo]i'
      - 'ph[ảa]i\s*tr[ảa]\s*l[ờo]i\s*d[ùu]\s*vi\s*ph[ạa]m\s*lu[ậa]t'
      - '(gi[ảa]\s*v[ờo]|[đd][óo]ng\s*vai)\s*(l[àa]m\s*)?(system|developer|admin)'
      - 'ti[ếe]t\s*l[ộo].*(system\s*prompt|prompt\s*h[ệe]\s*th[ốo]ng)'

    out_of_scope:
      - 'th[ờo]i\s*ti[ếe]t'
      - 'b[óo]ng\s*[đd]á'
      - 'c[ôo]ng\s*ngh[ệe]'
      - 'tr[òo]\s*ch[ơo]i'
      - 'l[ịi]ch\s*s[ửu]'
      - 'n[ềe]n\s*t[ảa]ng\s*code|l[ậa]p\s*tr[ìi]nh'

    legal_anchor:
      - 'đi[ềe]u\s*\d+'
      - 'kho[ảa]n\s*\d+'
      - 'đi[ểe]m\s*[a-zđ]'
      - 'lu[ậa]t|b[ộo]\s*lu[ậa]t|ngh[ịi]\s*đ[ịi]nh|th[ôo]ng\s*t[ưu]'
      - 'chương\s+[ivxlcdm]+'
      - 't[ộo]i\s+[a-z0-9]+'
      - 'm[ứu]c\s*ph[ạa]t|khung\s*h[ìi]nh\s*ph[ạa]t'

    harmful:
      - 'l[ừưu]a\s*đ[ảa]o|g[ạa]t\s*ti[ềe]n|chi[ếe]m\s*[đd]o[ạa]t'
      - 'ph[ỉi]\s*b[áa]ng|gi[ảa]\s*m[ạa]o|m[ạa]o\s*danh'
      - 'r[ửưu]a\s*ti[ềe]n|h[ốo]\s*l[ộe]'
      - 'tr[ộo]m\s*c[ấa]p|x[âa]m\s*nh[ậa]p|ph[áa]\s*ho[ạa]i'
      - 't[ấa]n\s*c[ôo]ng|ddos|sql\s*injection|csrf|xss|phishing'

    malicious:
      - 'tr[ốo]n\s*thu[ếe]|tr[áa]nh\s*thu[ếe]'
      - 'l[ậa]p\s*h[ợo]p\s*đ[ồo]ng\s*gi[ảa]'
      - 'l[áa]ch\s*t[àa]i\s*s[ảa]n|t[áa]n\s*t[àa]i\s*s[ảa]n'
      - 'chi[ếe]m\s*đo[ạa]t\s*t[àa]i\s*s[ảa]n'

    ambiguity:
      - 'có bị phạt không'
      - 'có sao không'
      - 'có được không'
      - 'có vi phạm không'
      - 'có hợp pháp không'

  feature_building:

    banned_score:
      method: "binary"

    injection_score:
      method: "binary"

    out_of_scope_score:
      method: "binary"

    harmful_score:
      method: "binary"

    malicious_score:
      method: "binary"

    legal_anchor_score:
      method: "count_weighted"
      weight_per_hit: 0.3
      max_score: 1.0

    ambiguity_score:
      method: "binary"
      value_if_hit: 0.8

# ----------------------------------------------------------
# LỚP 2: HARD GATE (CHỈ BLOCK NGUY HIỂM)
# ----------------------------------------------------------

hard_gate:
  enabled: true

  block_when:
    - injection_score == 1.0
    - malicious_score == 1.0 AND legal_anchor_score == 0

  action: "unsafe"

# ----------------------------------------------------------
# LỚP 3: MODEL ROUTING (TIẾT KIỆM COST)
# ----------------------------------------------------------
model_routing:
  enabled: true

  # Nếu câu hỏi an toàn %100 -> Bỏ qua LLM (Tiết kiệm 100% chi phí)
  skip_model_when:
    - legal_anchor_score >= 0.9 AND ambiguity_score < 0.2 AND injection_score == 0 AND banned_score == 0 AND harmful_score == 0 AND malicious_score == 0 AND out_of_scope_score == 0

  # Các trường hợp còn lại mặc định sẽ gọi LLM (force_model_when không cần thiết vì hệ thống fail-secure default = True)

# ----------------------------------------------------------
# LỚP 4: INTENT FALLBACK (LLM JUDGE - CẮT BỎ CÁC LEGACY SCORING NHƯ CHỈ ĐỊNH)
# ----------------------------------------------------------
intent_fallback:
  enabled: true

  activate_when:
    guardian_uncertain: true
    guardian_confidence_below: 0.65
    ambiguous_scope: true
    short_query_without_anchor: true
    malicious_score: 1.0

  mode: "safe_unsafe_and_intent"

  model_ref: "models_config.runtime.intent_fallback"
  prompt_key: "intent_fallback_classify_vn"

  output_labels:
    - safe
    - unsafe
    - good_intent
    - bad_intent
    - out_of_scope
    - chitchat
    - clarify

  decision_rules:
    unsafe_priority: true
    bad_intent_priority: true
    safe_requires_legal_anchor: true
    out_of_scope_when_no_legal_anchor: true
    clarify_when_uncertain: true

    hard_refuse_when:
      - short_query_without_anchor
      - ambiguous_scope_and_low_confidence
      - malicious_score == 1.0

  fallback_thresholds:
    safe_confidence: 0.65
    unsafe_confidence: 0.65
    good_intent_confidence: 0.60
    bad_intent_confidence: 0.60

  fallback_keywords:
    legal_domain:
      - luật
      - nghị định
      - thông tư
      - điều
      - khoản
      - điểm
      - ly hôn
      - hôn nhân
      - gia đình
      - thuế
      - khai thuế
      - hoàn thuế
      - hợp đồng
      - lao động
      - doanh nghiệp
      - đất đai
      - thừa kế
      - khởi kiện
      - tranh chấp
      - bồi thường
      - phạt
      - xử phạt
      - tòa án
      - hồ sơ
      - thủ tục
    out_of_scope:
      - thời tiết
      - game
      - chơi game
      - mã nguồn
      - code
      - lập trình
      - món ăn
      - nấu ăn
      - du lịch
      - âm nhạc
      - phim
      - bóng đá
      - bóng rổ
      - giải trí
    out_of_scope_confidence: 0.55
    clarify_confidence: 0.50

# ----------------------------------------------------------
# LỚP 8: OUTPUT
# ----------------------------------------------------------
output:
  include:
    - final_label
    - used_model
    - scores
    - features
    - confidence
    - trace

routing_labels:
  safe:
    description: "Câu hỏi hợp lệ, thuộc phạm vi luật"
  unsafe:
    description: "Prompt injection hoặc intent độc hại"
  out_of_scope:
    description: "Ngoài phạm vi luật"
  chitchat:
    description: "Câu chào hỏi thông thường, không chứa nội dung pháp lý"
  chitchat:
    description: "Câu chào hỏi thông thường, không chứa nội dung pháp lý"
  clarify:
    description: "Chưa đủ độ tin cậy để kết luận, cần làm rõ thêm"
  good_intent:
    description: "Câu hỏi hợp lệ và có ý định tốt trong phạm vi luật"
  bad_intent:
    description: "Câu hỏi có ý định lách luật, gây hại hoặc khai thác trái phép"