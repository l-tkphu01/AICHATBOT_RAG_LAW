# ============================================================
# QUERY CONFIG - Retrieval / reranking / query routing
# ============================================================

retrieval:
  dense_top_k: 15 
  sparse_top_k: 15 
  fusion_top_k: 20 
  rerank_top_k: 5 
  relevance_threshold: 0.3 
  rrf_k: 60 

reranker:
  provider: "cohere"
  model: "rerank-multilingual-v3.0"
  initial_retrieval_k: 20
  rerank_top_k: 5
  score_threshold: 0.05
  batch_size: 16
  max_length: 1024

query_processing:
  enabled: true
  mode: "balanced"
  profile: "legal_vn"
  flow:
    guard_stage: "guardian_config"
    intent_fallback_stage: "guardian_config.intent_fallback"
    intent_stage: "models_config.runtime.intent_fallback"
    rewrite_stage: "prompts_config.legal_query_rewrite_multi"
    short_rewrite_stage: "prompts_config.legal_query_rewrite_short"
    retrieval_stage: "retrieval"
    rerank_stage: "reranker"
    generation_stage: "generation"
    validation_stage: "validation"
  routing:
    safe:
      action: "continue_pipeline"
      next_step: "rewrite_then_retrieve"
    unsafe:
      action: "reject_or_refuse"
      response_key: "refuse_unsafe_query"
    out_of_scope:
      action: "reject_or_refuse"
      response_key: "refuse_legal_scope"
    chitchat:
      action: "reject_or_refuse"
      response_key: "chitchat_response"
    clarify:
      action: "request_more_context"
      response_key: "intent_clarify_message"
    good_intent:
      action: "continue_pipeline"
      next_step: "rewrite_then_retrieve"
    bad_intent:
      action: "reject_or_refuse"
      response_key: "refuse_unsafe_query"
    uncertain:
      action: "reject_or_refuse"
      response_key: "refuse_unknown_query"
  preprocessing:
    preserve_legal_citations: true
    preserve_named_entities: true
  rewrite:
    enabled: true
    strategy: "multi_query_then_short"
    max_variants: 3
    short_query_threshold_tokens: 6
    preserve_legal_anchor: true
    preserve_citations: true
    model_ref: "models_config.runtime.query_rewriter"
    multi_query_model_ref: "models_config.runtime.query_rewriter"
    prompt_keys:
      multi: "legal_query_rewrite_multi"
      short: "legal_query_rewrite_short"
